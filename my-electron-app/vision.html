<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styling.css">
    <title>Computer Vision</title>
    <link rel="stylesheet" href="styling.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body class="winky-rough">
    <h1>Computer Vision</h1>
    <p>This is a CV tool for analyzing wildfire damage. Upload a satellite image or a regular image (sat 85% reg 90%). It takes time to process.</p>
    
    <button class="back-button" onclick="window.location.href='index.html'">Back to Home</button>

    <form id="vision-form">
        <label for="imageType">Select Image Type:</label>
        <select id="imageType" name="imageType">
            <option value="Satellite">Satellite</option>
            <option value="Regular">Regular</option>
        </select>
        <br><br>
        <label for="imageInput">Upload Image:</label>
        <input type="file" id="imageInput" name="imageInput" accept="image/*">
        <p>We will check that the image is of an acceptable size and format for the model and return the results to you.</p>
        <button type="submit" id="submitButton">Submit</button>
    </form>

    <script>
        document.getElementById("vision-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const file = document.getElementById("imageInput").files[0];
            const imageType = document.getElementById("imageType").value;
            if (!file) return alert("No file selected.");
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Image = event.target.result;
                const formData = {
                    base64: base64Image,
                    imageType: imageType
                };
                window.electronAPI.submitVisionForm(formData);
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
